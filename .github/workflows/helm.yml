name: Lint and Test Charts
on:
  pull_request:
    paths:
      - "charts/**"
      - '!**.md'
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # 2.9.0
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # 1.15.1
        if: steps.list-changed.outputs.changed == 'true'
        with:
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          version: v0.33.0
      - name: Apply cert-manager
        run: |
          CERT_MANAGER_VERSION=$(grep '^CERT_MANAGER_VERSION' Makefile.versions | awk '{print $3}')
          CERT_MANAGER_CHECKSUM=$(grep '^CERT_MANAGER_CHECKSUM' Makefile.versions | awk '{print $3}')
          curl -fsSL "https://github.com/cert-manager/cert-manager/releases/download/v${CERT_MANAGER_VERSION}/cert-manager.yaml" -o cert-manager.yaml
          echo "${CERT_MANAGER_CHECKSUM}  cert-manager.yaml" | sha256sum -c -
          kubectl apply -f cert-manager.yaml
          kubectl -n cert-manager wait --for=condition=available --timeout=180s --all deployments
      - name: Run chart-testing (install)
        run: ct install --config ct.yaml

name: Book
on:
  pull_request:
  push:
    branches:
      - 'main'
permissions:
  contents: read
jobs:
  build:
    name: Build book
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make book
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book
          path: docs/book
          retention-days: 1
  publish:
    name: Publish book on GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
      # do not remove helm chart related files if present
      - run: ls | grep -v -E "index.yaml|.*\.tgz" | xargs rm -rf
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: book
      - run: git add .
      - name: Check diff
        run: |
          diffs=$(git status -s)
          if [ "$diffs" = "" ]; then
            echo "NO_DIFF=1" >> $GITHUB_ENV
          else
            printf "%s\n" "$diffs"
          fi
      - name: Commit changes
        if: env.NO_DIFF != '1'
        run: |
          git config --global user.name 'Cybozu Neco'
          git config --global user.email 'cybozu-neco@users.noreply.github.com'
          git commit -m 'update'
      - name: Push to gh-pages
        if: github.ref == 'refs/heads/main' && env.NO_DIFF != '1'
        run: git push origin gh-pages

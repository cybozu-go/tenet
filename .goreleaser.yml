version: 2
project_name: tenet
dist: bin/
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/tenet-controller
    goos:
      - linux
    goarch:
      - amd64
      - arm64
dockers_v2:
  - images:
      - "ghcr.io/cybozu-go/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - LICENSE
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
